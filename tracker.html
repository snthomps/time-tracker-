  <!-- Data backup/restore UI injected by service worker support -->
  <script>
    // ── Export / Import data backup ──
    function exportData() {
      const data = localStorage.getItem('freelance_tracker_v5');
      if (!data) { alert('No data to export.'); return; }
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tracker-backup-' + new Date().toISOString().split('T')[0] + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }
    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed.entries) throw new Error('Invalid backup file');
            localStorage.setItem('freelance_tracker_v5', ev.target.result);
            alert('Data restored! Reloading...');
            location.reload();
          } catch(err) {
            alert('Could not restore: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // ── Floating backup button ──
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('div');
      btn.innerHTML = '💾';
      btn.title = 'Backup / Restore data';
      btn.style.cssText = 'position:fixed;bottom:80px;right:14px;width:40px;height:40px;border-radius:50%;background:#1c2128;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:100;font-size:18px;box-shadow:0 2px 8px #0008;';
      
      const menu = document.createElement('div');
      menu.style.cssText = 'display:none;position:fixed;bottom:126px;right:14px;background:#161b22;border:1px solid #21262d;border-radius:10px;overflow:hidden;z-index:101;min-width:160px;box-shadow:0 4px 20px #0008;';
      menu.innerHTML = '<button onclick="exportData()" style="display:block;width:100%;padding:14px 18px;background:transparent;border:none;color:#e6edf3;font-size:14px;cursor:pointer;text-align:left;font-family:system-ui,sans-serif;border-bottom:1px solid #21262d;">⬇ Export Backup</button><button onclick="importData()" style="display:block;width:100%;padding:14px 18px;background:transparent;border:none;color:#e6edf3;font-size:14px;cursor:pointer;text-align:left;font-family:system-ui,sans-serif;">⬆ Restore Backup</button>';
      
      btn.onclick = () => { menu.style.display = menu.style.display === 'none' ? 'block' : 'none'; };
      document.addEventListener('click', (e) => { if(!btn.contains(e.target)&&!menu.contains(e.target)) menu.style.display='none'; });
      document.body.appendChild(menu);
      document.body.appendChild(btn);
    });

    // ── Register service worker for offline support ──
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'tracker-v1';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './tracker.html'])));
          self.skipWaiting();
        });
        self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./'))));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
